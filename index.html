<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0B090F" />
    <meta
      name="description"
      content="Gerenciador de torneios de Riichi Mahjong com calculadora de pontos"
    />
    <title>Mojoca</title>

    <!--
      Tema antes da primeira pintura: sem piscar o claro quando o Velvet Darkness
      está salvo. Mesmas chaves e cores de PreferenciasProvider e temas.ts.
    -->
    <script>
      ;(function () {
        var tema = null
        try {
          tema = localStorage.getItem('riichi-manager-tema')
        } catch (erro) {}
        // Sem escolha salva, abre no escuro.
        var escuro =
          tema !== 'claro' &&
          (tema !== 'automatico' ||
            (!!window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches))
        var raiz = document.documentElement
        raiz.setAttribute('data-tema', escuro ? 'escuro' : 'claro')
        raiz.style.colorScheme = escuro ? 'dark' : 'light'
        if (escuro) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B090F')
        }
      })()
    </script>

    <!-- Ícone com o kanji 中 (chun) -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' fill='%23d32f2f'%3E%E4%B8%AD%3C/text%3E%3C/svg%3E"
    />

    <!-- Ícones Font Awesome (gratuito via CDN) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <script type="module" crossorigin src="/Riichi-Manager/assets/index-7lUANiBN.js"></script>
    <link rel="stylesheet" crossorigin href="/Riichi-Manager/assets/index-43uVBpLz.css">
  </head>
  <body>
    <!-- Preferências de uso antes da primeira pintura (ver PreferenciasProvider). -->
    <script>
      ;['alto-contraste', 'modo-compacto', 'toque-ampliado'].forEach(function (classe) {
        try {
          if (localStorage.getItem('riichi-manager-' + classe) === 'true') {
            document.body.classList.add(classe)
          }
        } catch (erro) {}
      })
    </script>
    <!-- React monta aqui. Sem JavaScript o app não funciona. -->
    <div id="app"></div>
  </body>
</html>
